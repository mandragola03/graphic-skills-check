<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SkillFlex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#13151c;
  --surface:#1c1f29;
  --surface-2:#252938;
  --line:#333748;
  --text:#f4f2ec;
  --text-dim:#9a9db3;
  --gold:#f2b807;
  --gold-dim:#7a6420;
  --teal:#33d6c0;
  --red:#ef5b5b;
  --green:#4fd67a;
  --purple:#b14eff;
  --grad-swag:linear-gradient(135deg, #ffc93c 0%, #ff6b4a 45%, #b14eff 100%);
  --grad-swag-soft:linear-gradient(135deg, rgba(255,201,60,.16) 0%, rgba(255,107,74,.16) 45%, rgba(177,78,255,.16) 100%);
  --font-display:'Space Grotesk', sans-serif;
  --font-body:'Inter', sans-serif;
}
:root:not([data-theme="dark"]){
  /* app is intentionally single-theme (dark) regardless of system preference */
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  font-feature-settings:"kern" 1, "liga" 1;
}
#app{
  max-width:640px;
  margin:0 auto;
  min-height:100vh;
  padding:28px 22px 60px;
  display:flex;
  flex-direction:column;
}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-0.01em;}
p{line-height:1.6;color:var(--text-dim);margin:0;font-size:15px;}
button{font-family:var(--font-body);cursor:pointer;transition:transform .15s cubic-bezier(.2,.8,.2,1), background .15s ease, border-color .15s ease, box-shadow .15s ease;}
button:active{transform:scale(0.98);}
.hidden{display:none !important;}

/* ---- top bar ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:30px;
}
.brand{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-0.015em;color:var(--text);}
.brand span{
  background:var(--grad-swag);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;filter:drop-shadow(0 0 12px rgba(255,107,74,.35));
}
.mode-switch{
  display:flex;background:var(--surface);border-radius:10px;padding:3px;border:1px solid var(--line);
}
.mode-switch button{
  border:none;background:transparent;color:var(--text-dim);font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:8px;
}
.mode-switch button.active{background:var(--surface-2);color:var(--text);}

/* ---- home ---- */
.home-hero{margin-top:16px;margin-bottom:36px;}
.home-hero h1{font-size:36px;line-height:1.16;font-weight:700;margin-bottom:16px;max-width:12ch;letter-spacing:-0.02em;}
.home-hero p{font-size:16.5px;max-width:36ch;line-height:1.6;}
.home-cards{display:flex;flex-direction:column;gap:14px;margin-top:30px;}
.role-card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:22px;text-align:left;display:flex;align-items:center;gap:16px;
  box-shadow:0 1px 2px rgba(0,0,0,.16);
}
.role-card:hover{border-color:var(--teal);background:var(--surface-2);transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.22);}
.role-card .icon{
  width:46px;height:46px;border-radius:14px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;
}
.role-card .txt h3{font-size:16.5px;margin-bottom:5px;font-weight:600;letter-spacing:-0.005em;}
.role-card .txt p{font-size:13.5px;line-height:1.5;}

/* ---- card di navigazione nel profilo studente (Prove / Dispense) ---- */
.profile-nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
.profile-nav-card{
  position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;
  padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:14px;
  transition:transform .15s cubic-bezier(.2,.8,.2,1), border-color .15s ease, background .15s ease;
}
.profile-nav-card:hover{border-color:var(--teal);background:#242838;transform:translateY(-1px);}
.profile-nav-card .nav-top{display:flex;align-items:center;justify-content:space-between;}
.profile-nav-card .nav-icon{
  width:40px;height:40px;border-radius:12px;background:var(--grad-swag);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  box-shadow:0 3px 10px rgba(255,107,74,.25);
}
.profile-nav-card .nav-chev{font-size:18px;color:var(--text-dim);font-weight:700;}
.profile-nav-card h3{font-size:14.5px;font-weight:700;letter-spacing:-0.005em;}
.profile-nav-card p{font-size:11.5px;color:var(--text-dim);margin-top:3px;line-height:1.4;}
.nav-dot{
  position:absolute;top:14px;right:14px;width:10px;height:10px;border-radius:50%;
  background:var(--red);box-shadow:0 0 0 3px var(--surface-2);
}

/* ---- swag mood (home) ---- */
:root{--font-apple:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",var(--font-body);}

.sf-logo-wrap{text-align:center;padding-top:12px;margin-bottom:14px;}
.sf-logo{
  font-family:var(--font-display);font-weight:800;font-size:54px;line-height:1;letter-spacing:-0.035em;
  color:var(--text);
}
.sf-logo span{
  background:var(--grad-swag);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 28px rgba(177,78,255,.35));
}
@media (max-width:420px){.sf-logo{font-size:42px;}}

.home-hero.apple-mood{margin-top:0;margin-bottom:44px;position:relative;text-align:center;}
.home-tagline{
  font-family:var(--font-apple);font-size:22px;line-height:1.3;font-weight:600;
  letter-spacing:-0.015em;color:var(--text);max-width:20ch;margin:0 auto;
}
.home-hero.apple-mood p{
  font-family:var(--font-apple);font-size:17px;line-height:1.5;font-weight:400;
  color:var(--text-dim);max-width:34ch;letter-spacing:-0.006em;
}
@media (max-width:420px){.home-hero.apple-mood h1{font-size:32px;}}

.home-cards.apple-mood{display:flex;flex-direction:column;gap:16px;background:none;border:none;border-radius:0;overflow:visible;}
.role-card.apple{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 20px;
  box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;align-items:center;gap:16px;position:relative;overflow:hidden;
}
.role-card.apple::before{
  content:"";position:absolute;inset:0;background:var(--grad-swag-soft);opacity:0;transition:opacity .25s ease;
}
.role-card.apple:hover{transform:translateY(-2px);border-color:transparent;box-shadow:0 10px 32px rgba(177,78,255,.22),0 4px 14px rgba(255,107,74,.16);}
.role-card.apple:hover::before{opacity:1;}
.role-card.apple .icon{
  width:46px;height:46px;border-radius:14px;background:var(--grad-swag);font-size:21px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(255,107,74,.3);
  position:relative;z-index:1;flex-shrink:0;
}
.role-card.apple .icon.sq{
  width:52px;height:52px;border-radius:8px;font-size:19px;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 20px rgba(255,107,74,.4),inset 0 1px 0 rgba(255,255,255,.15);
}
.role-card.apple .txt{flex:1;position:relative;z-index:1;}
.role-card.apple .txt h3{font-family:var(--font-display);font-size:16.5px;font-weight:700;letter-spacing:-0.012em;margin-bottom:3px;color:var(--text);}
.role-card.apple .txt p{font-family:var(--font-apple);font-size:13px;color:var(--text-dim);letter-spacing:-0.006em;}
.role-card.apple .chev{font-size:22px;color:var(--purple);font-weight:700;flex-shrink:0;position:relative;z-index:1;}
.home-info{
  font-family:var(--font-apple);font-size:12.5px;line-height:1.6;color:var(--text-dim);
  max-width:36ch;margin:26px auto 0;text-align:center;letter-spacing:-0.003em;
}

/* ---- generic card / screen ---- */
.screen{display:flex;flex-direction:column;flex:1;}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:28px;
  box-shadow:0 1px 2px rgba(0,0,0,.14), 0 12px 32px rgba(0,0,0,.18);
}

/* ---- intro form ---- */
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:7px;font-weight:500;letter-spacing:.01em;}
.field input, .field select, textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  color:var(--text);padding:13px 15px;font-size:15.5px;font-family:var(--font-body);
  transition:border-color .15s ease, box-shadow .15s ease;
}
.field input:focus, .field select:focus, textarea:focus{border-color:var(--teal);outline:2px solid rgba(51,214,192,.35);outline-offset:1px;}

.pwd-wrap{position:relative;}
.pwd-wrap input{padding-right:78px;}
.pwd-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  color:var(--text-dim);font-size:12px;font-weight:600;padding:7px 11px;
}
.pwd-toggle:hover{color:var(--text);border-color:var(--teal);}
.class-pick{display:flex;gap:5px;}
.class-pick button{
  flex:1;padding:11px 2px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text);font-weight:600;font-size:11.5px;
}
.class-pick button.sel{border-color:var(--gold);background:rgba(242,184,7,.12);color:var(--gold);}

.btn-primary{
  background:var(--gold);color:#1a1400;border:none;border-radius:14px;padding:15px 22px;
  font-weight:700;font-size:15.5px;width:100%;margin-top:10px;letter-spacing:-0.005em;
  box-shadow:0 4px 14px rgba(242,184,7,.22);
}
.btn-primary:hover:not(:disabled){box-shadow:0 6px 18px rgba(242,184,7,.3);}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-dim);cursor:not-allowed;box-shadow:none;}
.btn-secondary{
  background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;
  padding:14px 22px;font-weight:600;font-size:14.5px;width:100%;
}
.btn-secondary:hover{border-color:var(--teal);background:var(--surface-2);}
.btn-ghost{background:transparent;border:none;color:var(--text-dim);font-size:13.5px;text-decoration:underline;padding:8px;text-underline-offset:3px;}
.btn-ghost:hover{color:var(--text);}

/* ---- progress ---- */
.progress-wrap{margin-bottom:20px;}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.progress-top .r-label{font-size:12.5px;color:var(--text-dim);font-weight:600;letter-spacing:.02em;}
.progress-top .r-count{font-size:12.5px;color:var(--text-dim);}
.progress-bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--teal);border-radius:6px;transition:width .35s cubic-bezier(.2,.8,.2,1);}

/* ---- round header ---- */
.round-header{margin-bottom:22px;}
.round-header .rk{font-size:13px;color:var(--teal);font-weight:600;margin-bottom:7px;letter-spacing:.02em;}
.round-header h2{font-size:23px;line-height:1.25;margin-bottom:7px;font-weight:600;}
.round-header .sub{font-size:14.5px;line-height:1.5;}

/* ---- question ---- */
.q-text{font-size:17.5px;font-weight:600;margin-bottom:18px;line-height:1.45;letter-spacing:-0.005em;}

.ricerca-task{background:var(--surface-2);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;}
.ricerca-num{
  position:absolute;top:14px;left:14px;width:22px;height:22px;border-radius:7px;background:var(--grad-swag);
  color:#13151c;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;
}
.ricerca-task p{font-size:14px;line-height:1.5;padding-left:32px;margin-bottom:12px;}
.ricerca-upload{padding-left:32px;}
.ricerca-add-btn{
  width:100%;padding:18px;border-radius:13px;border:1.5px dashed var(--line);background:transparent;
  color:var(--text-dim);font-weight:700;font-size:13.5px;
}
.ricerca-thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;display:block;margin-bottom:8px;}
.ricerca-btn-row{display:flex;gap:8px;}
.ricerca-btn-row button{flex:1;}
.btn-secondary.sm, .btn-ghost.sm{padding:9px 10px;font-size:12.5px;}
.teacher-photo-review{margin-top:10px;}
.teacher-photo-review p{font-size:11.5px;color:var(--text-dim);font-weight:700;margin-bottom:6px;}
.teacher-photo-grid{display:flex;gap:8px;flex-wrap:wrap;}
.teacher-photo-thumb{width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:pointer;}

.opts{display:flex;flex-direction:column;gap:11px;}
.opt{
  text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;font-size:15px;color:var(--text);line-height:1.4;
}
.opt:hover{border-color:var(--teal);background:#242838;}
.opt.chosen{border-color:var(--gold);background:rgba(242,184,7,.1);}
.opt.multi.chosen::before{content:"✓ ";color:var(--gold);font-weight:700;}

/* ---- boss fight text ---- */
.boss-brief{
  background:var(--surface-2);border-radius:14px;padding:17px 18px;margin-bottom:20px;font-size:14px;
  line-height:1.6;border-left:3px solid var(--gold);
}

/* ---- detective poster mockup ---- */
.poster-mock{
  position:relative;width:100%;aspect-ratio:3/4;border-radius:18px;overflow:hidden;
  margin-bottom:20px;background:
    radial-gradient(120% 90% at 30% 20%, #3a3320 0%, #1d1f14 45%, #0d0e0a 100%);
  border:1px solid var(--line);
  box-shadow:0 10px 28px rgba(0,0,0,.28);
}
.poster-title{
  position:absolute;top:14%;left:6%;right:6%;
  font-family:var(--font-display);font-weight:700;font-size:9.2vw;line-height:0.94;
  color:#d8d4c4;text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.4);
}
@media(min-width:600px){.poster-title{font-size:54px;}}
.poster-shout{
  position:absolute;top:46%;left:6%;right:6%;
  font-weight:800;font-size:6.2vw;color:#ffce33;text-transform:uppercase;letter-spacing:.01em;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
@media(min-width:600px){.poster-shout{font-size:34px;}}
.poster-info{
  position:absolute;bottom:16%;left:6%;right:6%;
  display:flex;flex-wrap:wrap;gap:7px;
}
.poster-chip{
  background:rgba(255,255,255,.1);color:#cfcfc7;font-size:11px;font-weight:600;
  padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.15);
}
.poster-cta{
  position:absolute;bottom:5%;left:6%;
  background:#e6dfc8;color:#12130d;font-weight:700;font-size:12px;
  padding:9px 18px;border-radius:999px;
}
.poster-zone{transition:box-shadow .3s cubic-bezier(.2,.8,.2,1), outline-color .3s ease;border-radius:10px;}
.poster-zone.hl{
  outline:2px solid var(--teal);outline-offset:5px;
  box-shadow:0 0 0 5px rgba(51,214,192,.12);
}
.poster-hint{font-size:12.5px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}

/* ---- receipt / result ---- */
.receipt{
  background:var(--surface);border:1px dashed var(--line);border-radius:22px;padding:28px;
  box-shadow:0 1px 2px rgba(0,0,0,.14), 0 12px 32px rgba(0,0,0,.18);
}
.receipt-head{text-align:center;margin-bottom:22px;}
.receipt-head .emoji{font-size:36px;margin-bottom:9px;}
.receipt-head h2{font-size:21px;font-weight:600;}
.receipt-row{
  display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);
  font-size:14.5px;
}
.receipt-row:last-child{border-bottom:none;}
.receipt-row .k{color:var(--text-dim);}
.receipt-row .v{font-weight:600;}
.receipt-total{
  margin-top:16px;padding-top:16px;border-top:2px solid var(--line);
  display:flex;justify-content:space-between;align-items:baseline;
}
.receipt-total .k{font-size:15px;font-weight:600;}
.receipt-total .v{font-size:28px;font-family:var(--font-display);font-weight:700;color:var(--gold);letter-spacing:-0.01em;}
.level-tag{
  display:inline-block;margin-top:16px;padding:7px 15px;border-radius:999px;
  background:rgba(51,214,192,.14);color:var(--teal);font-size:13px;font-weight:600;
}
.saved-tag{
  display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--green);font-weight:600;
}
.code-box{
  margin-top:24px;background:var(--surface-2);border-radius:14px;padding:16px;
}
.code-box textarea{
  width:100%;background:transparent;border:none;color:var(--text-dim);font-size:11px;
  font-family:monospace;resize:none;height:70px;line-height:1.5;
}
.code-hint{font-size:13px;margin-top:16px;color:var(--text-dim);line-height:1.55;}

/* ---- teacher ---- */
.pin-wrap{text-align:center;padding-top:64px;}
.pin-wrap h2{font-size:22px;font-weight:600;}
.pin-wrap input{
  text-align:center;font-size:24px;letter-spacing:7px;max-width:230px;margin:0 auto;
  border-radius:14px;
}
.import-box textarea{height:92px;font-family:monospace;font-size:12px;border-radius:12px;line-height:1.6;}
.stu-table{width:100%;border-collapse:collapse;margin-top:20px;font-size:13.5px;}
.stu-table th{
  text-align:left;color:var(--text-dim);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;padding:9px 11px;border-bottom:1px solid var(--line);
}
.stu-table td{padding:11px;border-bottom:1px solid var(--line);}
.stu-table tr{transition:background .15s ease;}
.stu-table tr:hover td{background:var(--surface-2);cursor:pointer;}
.vote-pill{
  display:inline-block;min-width:28px;text-align:center;padding:4px 9px;border-radius:9px;font-weight:700;
}
.vote-pill.low{background:rgba(239,91,91,.15);color:var(--red);}
.vote-pill.mid{background:rgba(242,184,7,.15);color:var(--gold);}
.vote-pill.high{background:rgba(79,214,122,.15);color:var(--green);}
.empty-state{text-align:center;padding:54px 20px;color:var(--text-dim);}
.empty-state p{line-height:1.7;}
.detail-back{margin-bottom:16px;}
.hist-item{
  background:var(--surface-2);border-radius:14px;padding:16px;margin-bottom:11px;font-size:13.5px;
}
.hist-item .hist-top{display:flex;justify-content:space-between;margin-bottom:7px;font-weight:600;align-items:center;}
.breakdown{font-size:12.5px;color:var(--text-dim);margin-top:7px;line-height:1.7;}

.review-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-dim);margin-bottom:14px;padding:10px 14px;background:var(--surface-2);border-radius:12px;}
.review-legend span{display:inline-flex;align-items:center;gap:6px;}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0;}
.legend-dot.green{background:var(--green);}
.legend-dot.red{background:var(--red);}
.legend-dot.yellow{background:var(--gold);}
.review-q{margin-bottom:16px;}
.review-q .review-q-text{font-size:13.5px;font-weight:600;margin-bottom:7px;line-height:1.4;}
.review-opt{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;margin-bottom:6px;line-height:1.4;color:var(--text-dim);}
.review-opt.correct-picked{border-color:var(--green);background:rgba(79,214,122,.14);color:var(--green);font-weight:600;}
.review-opt.wrong-picked{border-color:var(--red);background:rgba(239,91,91,.14);color:var(--red);font-weight:600;}
.review-opt.correct-reveal{border-color:var(--gold);background:rgba(242,184,7,.14);color:var(--gold);font-weight:600;}
.toolbar{display:flex;gap:10px;margin-top:20px;}
.toolbar button{flex:1;}
.class-filter{display:flex;gap:7px;margin:18px 0 6px;flex-wrap:wrap;}
.class-filter button{
  padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);
  color:var(--text-dim);font-size:12.5px;font-weight:600;
}
.class-filter button.sel{border-color:var(--teal);color:var(--teal);}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  padding:13px 22px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;

/* Rimescola in modo casuale un array (Fisher-Yates), senza toccare l'originale. */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
/* Per i round quiz con randomize:true, crea una copia con le domande in
   ordine casuale e, per ognuna, anche le opzioni in ordine casuale (l'indice
   della risposta corretta viene ricalcolato di conseguenza). Così due
   studenti che fanno la stessa prova nello stesso momento non vedono le
   domande né le risposte messe allo stesso modo. */
function buildRandomizedQuizRound(round){
  const questions = shuffleArray(round.questions).map(q=>{
    const opts = q.opts.map((text,i)=>({text, isCorrect:i===q.correct}));
    const shuffled = shuffleArray(opts);
    return {q:q.q, opts:shuffled.map(o=>o.text), correct:shuffled.findIndex(o=>o.isCorrect)};
  });
  return {...round, questions};
}
/* Prepara i round "vivi" per il tentativo che sta per iniziare: i round
   quiz con randomize:true vengono rimescolati da capo, gli altri restano
   quelli originali della prova. */
function buildActiveRounds(prova){
  return prova.rounds.map(r => (r.type==="quiz" && r.randomize) ? buildRandomizedQuizRound(r) : r);
}

   media degli studenti che l'hanno già fatta non si aggiorna da sola finché
   non tocca qualcos'altro: qui la ricalcoliamo subito per tutti loro, così il
   cambio è retroattivo e immediato, non solo per le prove future. */
function recomputeAllAccountsForProva(provaId){
  const accounts = getAccounts();
  let changed = false;
  Object.keys(accounts).forEach(uname=>{
    const acc = accounts[uname];
    if(acc.prove && acc.prove.some(p=>p.provaId===provaId)){
      recomputeStudentProve(acc);
      changed = true;
    }
  });
  if(changed) saveAccounts(accounts);
}

/* Costruisce il dettaglio/correzione di una prova già fatta: round per round,
   mostra cosa era giusto/sbagliato. In modalità editable (solo per il docente)
   aggiunge un bottone "Modifica punteggio" per ogni round. */
function buildProvaReviewBlock(p, opts){
  opts = opts || {};
  const wrap = el("div","");

  // legenda: solo se almeno un round ha i dati per la correzione colorata (le prove più vecchie non li hanno)
  const hasColoredReview = p.rounds && Object.values(p.rounds).some(rr=>rr && rr.picked);
  if(hasColoredReview){
    const legend = el("div","review-legend");
    legend.innerHTML = `<span><span class="legend-dot green"></span>Risposta data — giusta</span><span><span class="legend-dot red"></span>Risposta data — sbagliata</span><span><span class="legend-dot yellow"></span>La risposta corretta era questa</span>`;
    wrap.appendChild(legend);
  }

  if(p.rounds){
    Object.keys(p.rounds).forEach(k=>{
      const rr = p.rounds[k];
      if(!rr) return;
      const roundDef = ROUND_REGISTRY[k];
      const box = el("div","hist-item");
      const title = roundDef ? roundDef.title : k;
      const topRow = el("div","hist-top");
      topRow.innerHTML = `<span>${title}</span><span>${rr.correct}/${rr.total}</span>`;
      box.appendChild(topRow);

      if(opts.editable){
        const editBtn = el("button","btn-ghost sm", "✏️ Modifica punteggio");
        editBtn.style.marginBottom = "8px";
        editBtn.onclick = ()=>opts.onEditRound(k);
        box.appendChild(editBtn);
      }

      // correzione round quiz, con risposte colorate (verde/rosso/giallo)
      // uso rr.questions se presente (round mischiato: domande/opzioni viste davvero
      // in quel tentativo), altrimenti il registro fisso come prima
      const quizQuestions = rr.questions || (roundDef && roundDef.questions);
      if(rr.picked && quizQuestions){
        const qWrap = el("div","");
        quizQuestions.forEach((q, qi)=>{
          const pickedIdx = rr.picked[qi];
          if(pickedIdx===undefined) return;
          const qBox = el("div","review-q");
          qBox.appendChild(el("div","review-q-text", q.q));
          const isCorrect = pickedIdx===q.correct;
          q.opts.forEach((optTxt, oi)=>{
            let cls = "review-opt";
            if(oi===pickedIdx && isCorrect) cls += " correct-picked";
            else if(oi===pickedIdx && !isCorrect) cls += " wrong-picked";
            else if(oi===q.correct && !isCorrect) cls += " correct-reveal";
            const optDiv = el("div", cls, optTxt);
            qBox.appendChild(optDiv);
          });
          qWrap.appendChild(qBox);
        });
        box.appendChild(qWrap);
      } else if(rr.scored && quizQuestions){
        // ripiego per le prove fatte prima di questo aggiornamento (senza il dettaglio "picked")
        const qList = el("div","breakdown");
        let html = "";
        quizQuestions.forEach((q, qi)=>{
          const known = Object.prototype.hasOwnProperty.call(rr.scored, qi);
          if(!known) return;
          const ok = rr.scored[qi]===1;
          html += `${ok?"✓":"✗"} ${q.q}`;
          if(!ok) html += `<br><em>Risposta corretta: ${q.opts[q.correct]}</em>`;
          html += "<br>";
        });
        qList.innerHTML = html;
        box.appendChild(qList);
      }

      // correzione round "aperte": domanda + risposta scritta dallo studente
      if(rr.texts && roundDef && roundDef.questions){
        const aList = el("div","");
        roundDef.questions.forEach(q=>{
          const txt = rr.texts[q.id];
          if(txt===undefined) return;
          const qBox = el("div","review-q");
          qBox.appendChild(el("div","review-q-text", q.q));
          const ansDiv = el("div","review-opt", txt || "(nessuna risposta)");
          qBox.appendChild(ansDiv);
          aList.appendChild(qBox);
        });
        box.appendChild(aList);
      }

      // correzione round "detective": cosa era davvero un problema
      if(rr.selected && roundDef && roundDef.options){
        const mList = el("div","breakdown");
        let html = "";
        roundDef.options.forEach((o, oi)=>{
          const picked = rr.selected.includes(oi);
          if(o.ok) html += `${picked?"✓ trovato":"○ non trovato"} — ${o.t}<br>`;
          else if(picked) html += `✗ selezionato ma non era un problema — ${o.t}<br>`;
        });
        mList.innerHTML = html;
        box.appendChild(mList);
      }

      // riepilogo scelte boss fight
      if(rr.steps){
        const bList = el("div","breakdown");
        let html = "";
        Object.keys(rr.steps).forEach(stepKey=>{ html += `${stepKey}: ${rr.steps[stepKey]}<br>`; });
        bList.innerHTML = html;
        box.appendChild(bList);
      }

      // foto caricate (round "ricerca")
      if(rr.photos && Object.keys(rr.photos).length){
        const photoWrap = el("div","teacher-photo-review");
        photoWrap.appendChild(el("p","", "📎 Foto caricate"));
        const grid = el("div","teacher-photo-grid");
        Object.values(rr.photos).forEach(src=>{
          const img = document.createElement("img");
          img.src = src; img.className = "teacher-photo-thumb";
          img.onclick = ()=>window.open(src, "_blank");
          grid.appendChild(img);
        });
        photoWrap.appendChild(grid);
        box.appendChild(photoWrap);
      }

      wrap.appendChild(box);
    });
  }
  if(p.idea){
    const ideaP = el("p","", `Idea boss fight: "${p.idea}"`);
    ideaP.style.cssText = "font-size:12.5px;font-style:italic;margin-top:4px;";
    wrap.appendChild(ideaP);
  }
  return wrap;
}

/* ---------------- ACCOUNT STUDENTI (database condiviso — Firebase) ---------------- */

/* PROMEMORIA PER FUTURE MODIFICHE: gli account vivono ora in Firestore (cloud, condiviso
   fra tutti i dispositivi), non più solo nel localStorage. ACCOUNTS_CACHE è la copia in
   memoria tenuta sincronizzata in tempo reale da Firestore (onSnapshot); getAccounts()
   legge semplicemente da lì così tutto il resto del codice, scritto in stile sincrono,
   continua a funzionare senza modifiche. Il localStorage resta solo come ripiego se
   Firebase non è configurato o non risponde (offline, errore di connessione). */

const ACCOUNTS_KEY = "gsc_accounts_v1"; // ripiego locale, usato solo se Firestore non è raggiungibile
let ACCOUNTS_CACHE = {};
let db = null; // istanza Firestore, valorizzata da initFirebase()
let DISPENSE_CACHE = {}; // id -> {classe, filename, url, uploadedAt}, sincronizzata in tempo reale

function getAccounts(){
  if(db) return ACCOUNTS_CACHE;
  try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; }catch(e){ return {}; }
}
function saveAccounts(a){
  ACCOUNTS_CACHE = a; // aggiornamento ottimistico: l'interfaccia reagisce subito, senza aspettare la rete
  if(db){
    const before = LAST_KNOWN_ACCOUNT_KEYS;
    const nowKeys = Object.keys(a);
    before.forEach(k=>{ if(!nowKeys.includes(k)) db.collection("accounts").doc(k).delete().catch(()=>{}); });
    nowKeys.forEach(k=>{ db.collection("accounts").doc(k).set(a[k]).catch(()=>{ showToast("Salvataggio online non riuscito — riprova quando hai connessione"); }); });
    LAST_KNOWN_ACCOUNT_KEYS = nowKeys;
  } else {
    try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }
    catch(e){ showToast("Impossibile salvare il profilo su questo dispositivo"); }
  }
}
let LAST_KNOWN_ACCOUNT_KEYS = [];

function initFirebase(){
  if(typeof FIREBASE_CONFIG === "undefined" || !FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey){
    console.warn("Firebase non configurato: gli account restano locali a questo dispositivo.");
    return;
  }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    db.collection("accounts").onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = doc.data(); });
      ACCOUNTS_CACHE = next;
      LAST_KNOWN_ACCOUNT_KEYS = Object.keys(next);
      render();
    }, err=>{
      console.error("Errore connessione Firestore (accounts)", err);
      showToast("Connessione al database non riuscita — controlla la configurazione Firebase");
    });
    db.collection("config").doc("provaVisibility").onSnapshot(doc=>{
      SHARED_PROVA_STATE = (doc.exists && doc.data()) || {};
      render();
    }, err=>console.error("Errore connessione Firestore (config)", err));
    db.collection("config").doc("provaNoVoto").onSnapshot(doc=>{
      SHARED_PROVA_NOVOTO = (doc.exists && doc.data()) || {};
      render();
    }, err=>console.error("Errore connessione Firestore (config provaNoVoto)", err));
    db.collection("config").doc("provaArchived").onSnapshot(doc=>{
      SHARED_PROVA_ARCHIVED = (doc.exists && doc.data()) || {};
      render();
    }, err=>console.error("Errore connessione Firestore (config provaArchived)", err));
    db.collection("config").doc("provaTitles").onSnapshot(doc=>{
      SHARED_PROVA_TITLES = (doc.exists && doc.data()) || {};
      render();
    }, err=>console.error("Errore connessione Firestore (config provaTitles)", err));
    db.collection("dispense").onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{ next[doc.id] = doc.data(); });
      DISPENSE_CACHE = next;
      render();
    }, err=>console.error("Errore connessione Firestore (dispense)", err));
  }catch(e){
    console.error("Firebase init fallita", e);
    db = null;
  }
}

function normalizeUsername(u){ return (u||"").trim().toLowerCase().replace(/\s+/g,""); }
function calcFatturato(prove){ return (prove||[]).reduce((sum,p)=>sum+(p.gross||0), 0); }

/* ---- Dispense (PDF delle lezioni), organizzate per classe, su Firebase Storage ---- */
function getDispenseForClasse(classe){
  return Object.entries(DISPENSE_CACHE)
    .map(([id,d])=>({id, ...d}))
    .filter(d=> classe==="tutte" || d.classe===classe)
    .sort((a,b)=>b.uploadedAt-a.uploadedAt);
}
/* Aggiunge una dispensa come LINK (es. Google Drive), non carica alcun file:
   l'app salva solo il link e il titolo, niente Firebase Storage né costi. */
async function addDispensaLink(classe, filename, url){
  if(!db){ showToast("Database non disponibile — controlla la connessione"); return; }
  if(!filename || !filename.trim()){ showToast("Dai un titolo al PDF"); return; }
  if(!url || !/^https?:\/\//i.test(url.trim())){ showToast("Il link non sembra valido — deve iniziare con https://"); return; }

    console.error("Errore salvataggio dispensa", e);
    showToast("Salvataggio non riuscito — controlla la connessione");

}
async function deleteDispensa(id){
  if(!confirm("Eliminare questa dispensa? Il file su Drive non viene toccato, sparisce solo dall'app. Operazione non reversibile.")) return;
  try{

  }catch(e){

}

/* Media voto con un decimale (es. 7.3), tra 2 e 10. null se lo studente non ha
   ancora prove che contano per il voto (le prove con voto disattivato dal
   docente danno comunque fatturato/credito, ma non entrano in questa media). */
function computeAvgVoto(prove){
  if(!prove || !prove.length) return null;
  const countable = prove.filter(p=>!provaHasVotoDisabled(p.provaId));
  if(!countable.length) return null;
  const avg = countable.reduce((s,p)=>s+p.voto, 0) / countable.length;
  return Math.max(2, Math.min(10, Math.round(avg*10)/10));
}
function fmtVoto(v){ return (v===null || v===undefined) ? "—" : v.toFixed(1); }

/* Formula voto: si parte da 2 (voto minimo garantito, anche con 0€ di fatturato,
   es. prova annullata dal docente), poi ogni 200€ di totale fa salire di un punto,
   fino a un massimo di 10. Restituisce anche il credito residuo dopo aver "speso"
   i 200€ per ogni punto di voto guadagnato. */
function votoFromTotale(totale){
  const voto = Math.max(2, Math.min(10, 2 + Math.floor(totale/200)));
  const credito = totale - (voto-2)*200;
  return {voto, credito};
}

/* Ricalcola in ordine cronologico tutta la catena credito -> totale -> voto per ogni
   prova dello studente, e aggiorna il credito residuo e la media voto finali.
   Va richiamata ogni volta che una prova viene aggiunta, modificata o azzerata a mano,
   perché il credito di ogni prova dipende da quello lasciato dalla prova precedente. */
function recomputeStudentProve(acc){
  acc.prove.sort((a,b)=>a.ts-b.ts);
  let credito = 0;
  acc.prove.forEach(p=>{
    p.creditoPrima = credito;
    p.totale = (p.gross||0) + credito;
    const r = votoFromTotale(p.totale);
    p.voto = r.voto;
    credito = r.credito;
  });
  acc.credito = credito;
  acc.voto = computeAvgVoto(acc.prove);
}

/* Il docente corregge a mano il fatturato totale di uno studente, aggiungendo
   (o togliendo, con un numero negativo) una voce visibile nel suo storico
   prove — non è un valore "nascosto": lo studente la vede come tutte le
   altre, sotto il nome "Correzione manuale del docente". */
function teacherAdjustFatturato(uname){
  const accounts = getAccounts();
  const acc = accounts[uname];
  if(!acc) return;
  const input = prompt("Di quanto correggere il fatturato totale? Numero positivo per aggiungere, negativo per togliere (es. 50 oppure -30):", "0");
  if(input===null) return;
  const delta = parseFloat(String(input).replace(",", "."));
  if(isNaN(delta) || delta===0){ showToast("Nessuna modifica (valore non valido o zero)"); return; }
  acc.prove.push({ts:Date.now(), provaId:"manuale", provaTitle:"Correzione manuale del docente", gross:Math.round(delta), rounds:null, idea:""});
  recomputeStudentProve(acc);
  saveAccounts(accounts);
  showToast("Fatturato corretto ✓");
  render();
}

/* Il docente forza il voto attuale a un valore preciso, ignorando la media
   calcolata dalle prove. Lasciando vuoto il campo, torna al calcolo
   automatico. */

/* Numero di prove che lo studente ha iniziato ma non completato (e non ancora
   risolte dal docente con sblocco o chiusura a 0€) */
function pendingAbandonedCount(acc){
  if(!acc.startedProve) return 0;
  return Object.keys(acc.startedProve).filter(pid=>
    acc.startedProve[pid] && !acc.prove.find(p=>p.provaId===pid)
  ).length;
}

async function hashPass(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

}

async function doSignup(){
  const f = state.authForm;
  const uname = normalizeUsername(f.username);
  if(!uname || uname.length<3){ state.authError="Username troppo corto (minimo 3 caratteri)"; render(); return; }
  if(!/^[a-z0-9._-]+$/.test(uname)){ state.authError="Usa solo lettere, numeri, punto o trattino"; render(); return; }
  if(!f.nome.trim() || !f.cognome.trim() || !f.classe){ state.authError="Compila nome, cognome e classe"; render(); return; }
  if(!f.password || f.password.length<4){ state.authError="Password troppo corta (minimo 4 caratteri)"; render(); return; }
  if(f.password !== f.password2){ state.authError="Le due password non coincidono"; render(); return; }
  const accounts = getAccounts();
  if(accounts[uname]){ state.authError="Username già usato su questo Mac — scegline un altro"; render(); return; }
  const passHash = await hashPass(f.password);
  accounts[uname] = {passHash, passPlain:f.password, nome:f.nome.trim(), cognome:f.cognome.trim(), classe:f.classe, credito:0, voto:null, prove:[], startedProve:{}};
  saveAccounts(accounts);
  loginSuccess(uname, accounts[uname]);
}

async function doLogin(){
  const f = state.authForm;
  const uname = normalizeUsername(f.username);
  const accounts = getAccounts();
  const acc = accounts[uname];
  if(!acc){ state.authError="Nessun profilo con questo username su questo Mac. Creane uno nuovo."; render(); return; }
  const passHash = await hashPass(f.password);
  if(passHash !== acc.passHash){ state.authError="Password errata"; render(); return; }
  loginSuccess(uname, acc);
}

function makePasswordField(initialValue, onChange, autocompleteVal){
  const wrap = el("div","pwd-wrap");
  const inp = document.createElement("input");
  inp.type="password"; inp.value=initialValue||""; inp.placeholder="••••••";
  inp.autocomplete = autocompleteVal || "off";
  inp.autocapitalize = "off";
  inp.spellcheck = false;
  inp.oninput = e=>onChange(e.target.value);
  wrap.appendChild(inp);
  const toggle = el("button","pwd-toggle","Mostra");
  toggle.type="button";
  toggle.onclick = ()=>{
    if(inp.type==="password"){ inp.type="text"; toggle.textContent="Nascondi"; }
    else { inp.type="password"; toggle.textContent="Mostra"; }
  };
  wrap.appendChild(toggle);
  return wrap;
}

    const empty = el("p","", "Il tuo insegnante non ha ancora assegnato nessuna prova alla tua classe.");
    empty.style.cssText = "font-size:13px;background:var(--surface-2);border-radius:14px;padding:14px 16px;";
    screen.appendChild(empty);
  }
  visibleProve.forEach(prova=>{
    const completedRecord = acc.prove.find(p=>p.provaId===prova.id);
    if(completedRecord) return; // le completate stanno nella sezione sotto
    const alreadyStarted = !!startedProve[prova.id];
    const savedProgress = inProgressMap[prova.id];
    const canResume = !!resumeAllowed[prova.id] && !!savedProgress;

    let cardState; // "start" | "resume" | "abandoned"
    if(canResume) cardState = "resume";
    else if(alreadyStarted) cardState = "abandoned";
    else cardState = "start";

    const provaCard = el("div","prova-card" + (cardState==="start" || cardState==="resume" ? "" : " locked"));
    if(cardState==="start"){
      provaCard.innerHTML = `<div class="prova-label">Prova disponibile</div><h3>${prova.icon} ${getProvaTitle(prova)}</h3><p>${prova.desc}</p>`;
      const startBtn = el("button","btn-primary", `${prova.icon} Inizia →`);
      startBtn.onclick = ()=>{
        if(!prova.noAbandonLock){
          const accounts = getAccounts();
          const accRef = accounts[state.username];
          if(accRef){
            if(!accRef.startedProve) accRef.startedProve = {};
            accRef.startedProve[prova.id] = true;
            saveAccounts(accounts);
          }
        }
        ACTIVE_ROUNDS = buildActiveRounds(prova); ACTIVE_PROVA = prova;
        state.roundIndex=0; state.currentQIdx=0; state.answers={}; state.bossStepIdx=0; state.bossIdea=""; state.multiSel=[];
        if(!prova.noAbandonLock) saveInProgressSnapshot();
        state.screen="student-round"; render();
      };
      provaCard.appendChild(startBtn);
    } else if(cardState==="resume"){
      provaCard.innerHTML = `<div class="prova-label">🔓 Sbloccata dal docente</div><h3>${prova.icon} ${getProvaTitle(prova)}</h3><p>Riprendi da dove avevi lasciato — round ${savedProgress.roundIndex+1} di ${savedProgress.activeRounds.length}.</p>`;
      const resumeBtn = el("button","btn-primary", `${prova.icon} Riprendi →`);
      resumeBtn.onclick = ()=>{
        const accounts = getAccounts();
        const accRef = accounts[state.username];
        if(accRef && accRef.resumeAllowed) delete accRef.resumeAllowed[prova.id];
        saveAccounts(accounts);
        ACTIVE_ROUNDS = savedProgress.activeRounds; ACTIVE_PROVA = prova;
        state.roundIndex = savedProgress.roundIndex;
        state.answers = savedProgress.answers;
        state.currentQIdx=0; state.bossStepIdx=0; state.bossIdea=""; state.multiSel=[];
        state.screen="student-round"; render();
      };
      provaCard.appendChild(resumeBtn);
    } else {
      provaCard.innerHTML = `<div class="prova-label">🔒 Prova già iniziata</div><h3>${prova.icon} ${getProvaTitle(prova)}</h3><p>L'hai aperta ma non l'hai completata — non puoi rientrare per rifarla da capo.</p>`;
    }
    screen.appendChild(provaCard);
  });

  if(acc.prove.length){
    const histTitle = el("h3","", "Completate");
    histTitle.style.cssText="margin-top:28px;margin-bottom:12px;font-size:14px;color:var(--text-dim);";
    screen.appendChild(histTitle);
    [...acc.prove].sort((a,b)=>b.ts-a.ts).forEach(p=>{
      const item = el("div","hist-item");
      const top2 = el("div","hist-top");
      top2.innerHTML = `<span>${provaIcon(p.provaId)} ${p.provaTitle||"Prova"} · ${new Date(p.ts).toLocaleDateString("it-IT")}</span><span class="vote-pill ${p.voto<=4?'low':p.voto<=7?'mid':'high'}">${p.voto}</span>`;
      item.appendChild(top2);
      const line = el("div","", `Compenso: ${p.gross}€ · Totale con credito: ${p.totale}€`);
      line.style.fontSize="12px"; line.style.color="var(--text-dim)";
      item.appendChild(line);

      const isOpen = state.expandedProvaTs === p.ts;
      const toggleBtn = el("button","btn-ghost sm", isOpen ? "▲ Chiudi" : "▾ Apri correzione");
      toggleBtn.style.marginTop = "8px";

}

/* Salva "dove è arrivato" lo studente dentro questa prova — round per round,
   non domanda per domanda. Viene richiamata a ogni cambio di round, così se
   la pagina si blocca o si ricarica, il docente può sbloccarlo e farlo
   ripartire dall'ultimo round non ancora iniziato, invece che da zero. */
function saveInProgressSnapshot(){
  if(!state.username) return;
  const accounts = getAccounts();
  const acc = accounts[state.username];
  if(!acc) return;
  if(!acc.inProgress) acc.inProgress = {};
  acc.inProgress[ACTIVE_PROVA.id] = {
    roundIndex: state.roundIndex,
    answers: state.answers,
    activeRounds: ACTIVE_ROUNDS,
    savedAt: Date.now()
  };
  saveAccounts(accounts);
}

function nextRoundOrFinish(){
  state.roundIndex++;
  state.currentQIdx=0; state.bossStepIdx=0; state.multiSel=[];
  if(state.roundIndex>=ACTIVE_ROUNDS.length){
    finishProva();
  } else {
    saveInProgressSnapshot();
  }
  render();
}

function finishProva(){
  const {gross} = computeGrossEuro();
  const accounts = getAccounts();
  const acc = accounts[state.username];
  const roundsSnapshot = Object.fromEntries(ACTIVE_ROUNDS.map(r=>{
    const a = state.answers[r.key];
    if(!a) return [r.key, null];
    const base = {correct:a.correct, total:a.total, photos:a.photos || null};
    if(a.scored) base.scored = a.scored;     // round quiz: quale domanda giusta/sbagliata
    if(a.picked) base.picked = a.picked;     // round quiz: quale opzione ha scelto (per la correzione colorata)
    if(a.selected) base.selected = a.selected; // round "detective": cosa aveva selezionato
    if(a.steps) base.steps = a.steps;          // round boss fight: scelte fatte
    if(a.texts) base.texts = a.texts;          // round "aperte": risposte scritte dallo studente
    if(r.randomize && r.type==="quiz") base.questions = r.questions; // salvo le domande nell'ordine/opzioni viste davvero, per una correzione fedele
    return [r.key, base];
  }));
  const idea = (state.answers[BOSS_FIGHT.key] && state.answers[BOSS_FIGHT.key].idea) || "";

  let prova;
  if(acc){
    prova = {ts:Date.now(), provaId:ACTIVE_PROVA.id, provaTitle:ACTIVE_PROVA.title, gross, rounds:roundsSnapshot, idea};
    acc.prove.push(prova);
    recomputeStudentProve(acc); // ricalcola credito/totale/voto di questa e di tutte le prove, e la media
    // la prova è ora completata: tolta dalle "iniziate ma non finite" e dal progresso salvato
    if(acc.startedProve) delete acc.startedProve[ACTIVE_PROVA.id];
    if(acc.inProgress) delete acc.inProgress[ACTIVE_PROVA.id];
    if(acc.resumeAllowed) delete acc.resumeAllowed[ACTIVE_PROVA.id];
    saveAccounts(accounts);
  } else {
    // fallback, non dovrebbe succedere: profilo non trovato
    const voto = votoFromTotale(gross).voto;
    prova = {ts:Date.now(), provaId:ACTIVE_PROVA.id, provaTitle:ACTIVE_PROVA.title, gross, creditoPrima:0, totale:gross, voto, rounds:roundsSnapshot, idea};
  }
  state.lastProva = prova;
  state.screen = "student-result";
}

function renderQuizRound(round){
  $app.appendChild(topbar());
  const screen = el("div","screen");
  screen.appendChild(progressHeader(round));

  card.appendChild(roundHeader(round));

  const qi = state.currentQIdx;
  const question = round.questions[qi];

  const qLabel = el("div","", `Domanda ${qi+1} di ${round.questions.length}`);
  qLabel.style.cssText="font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;";
  card.appendChild(qLabel);

  card.appendChild(el("div","q-text", question.q));

  const opts = el("div","opts");
  question.opts.forEach((optTxt, idx)=>{
    const b = el("button","opt", optTxt);
    b.onclick = ()=>{
      if(!round.perQuestion) round.perQuestion = {};
      round.perQuestion[qi] = idx;
      if(!state.answers[round.key]) state.answers[round.key] = {correct:0, total:round.questions.length};
      // advance
      const isCorrect = idx===question.correct;
      state.answers[round.key]._last = isCorrect;
      if(!state.answers[round.key].scored) state.answers[round.key].scored = {};
      state.answers[round.key].scored[qi] = isCorrect ? 1 : 0;
      if(!state.answers[round.key].picked) state.answers[round.key].picked = {};
      state.answers[round.key].picked[qi] = idx;
      state.answers[round.key].correct = Object.values(state.answers[round.key].scored).reduce((a,b)=>a+b,0);
      // small delay feel via direct advance
      if(qi < round.questions.length-1){
        state.currentQIdx++;
        render();
      } else {
        nextRoundOrFinish();
      }
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);

  screen.appendChild(card);
  $app.appendChild(screen);
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("lettura file fallita"));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("immagine non valida"));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderRicercaRound(round){
  $app.appendChild(topbar());
  const screen = el("div","screen");
  screen.appendChild(progressHeader(round));

  card.appendChild(roundHeader(round));

  if(!state.answers[round.key]) state.answers[round.key] = {correct:0, total:round.tasks.length, photos:{}};

  round.tasks.forEach((task, idx)=>{
    const box = el("div","ricerca-task");
    box.innerHTML = `<div class="ricerca-num">${idx+1}</div><p>${task.prompt}</p>`;

    const uploadWrap = el("div","ricerca-upload");
    if(photos[task.id]){
      uploadWrap.innerHTML = `<img src="${photos[task.id]}" class="ricerca-thumb">`;
      const btnRow = el("div","ricerca-btn-row");
      const changeBtn = el("button","btn-secondary sm", "Cambia foto");
      changeBtn.onclick = ()=>triggerUpload(task.id);
      const removeBtn = el("button","btn-ghost sm", "Rimuovi");
      removeBtn.onclick = ()=>{ delete photos[task.id]; syncRicercaCount(round); render(); };
      btnRow.appendChild(changeBtn); btnRow.appendChild(removeBtn);
      uploadWrap.appendChild(btnRow);
    } else {
      const addBtn = el("button","ricerca-add-btn", "＋ Aggiungi foto");
      addBtn.onclick = ()=>triggerUpload(task.id);
      uploadWrap.appendChild(addBtn);
    }
    box.appendChild(uploadWrap);
    card.appendChild(box);
  });

  function triggerUpload(taskId){
    const input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.style.display="none";
    input.onchange = async ()=>{
      if(!input.files || !input.files[0]) return;
      try{
        const dataUrl = await resizeImageFile(input.files[0], 480, 0.55);
        photos[taskId] = dataUrl;
        syncRicercaCount(round);
        render();
      }catch(e){ showToast("Non sono riuscito a caricare questa foto, riprova"); }
    };
    document.body.appendChild(input);
    input.click();
    setTimeout(()=>document.body.removeChild(input), 3000);
  }

  const doneCount = round.tasks.filter(t=>photos[t.id]).length;
  const contBtn = el("button","btn-primary", doneCount===round.tasks.length ? "Conferma e continua →" : `Carica tutte le foto per continuare (${doneCount}/${round.tasks.length})`);
  contBtn.disabled = doneCount < round.tasks.length;
  contBtn.style.marginTop = "18px";
  contBtn.onclick = ()=>nextRoundOrFinish();
  card.appendChild(contBtn);

  screen.appendChild(card);
  $app.appendChild(screen);
}
function syncRicercaCount(round){
  const photos = state.answers[round.key].photos;
  const correct = round.tasks.filter(t=>photos[t.id]).length;
  state.answers[round.key].correct = correct;
  state.answers[round.key].total = round.tasks.length;

/* ---------------- STUDENT RESULT ---------------- */

function computeGrossEuro(){
  let totalPts=0, maxPts=0;
  ACTIVE_ROUNDS.forEach(r=>{
    const a = state.answers[r.key];
    if(!a) return;
    totalPts += (a.correct||0);
    maxPts += (a.total|| (r.questions?r.questions.length:0) );
  });
  if(maxPts===0) return {gross:10, totalPts, maxPts};
  let gross = Math.round((totalPts/maxPts)*1000);
  gross = Math.max(10, Math.min(1000, gross));
  return {gross, totalPts, maxPts};
}

function levelForVote(voto){
  if(voto<=3) return "Stagista";
  if(voto<=6) return "Junior";
  if(voto<=8) return "Professionista";
  return "Senior / Art Director";
}

/* Anteprima completa di una prova per il docente: tutte le domande/task di ogni
   round, con la risposta corretta segnata — utile per rivedere il contenuto prima
   di assegnarla a una classe. */
function buildProvaPreviewBlock(prova){
  const wrap = el("div","");
  prova.rounds.forEach(r=>{
    const box = el("div","hist-item");
    const top = el("div","hist-top");
    top.innerHTML = `<span>${r.rk} — ${r.title}</span>`;
    box.appendChild(top);
    if(r.sub){
      const subP = el("p","", r.sub);
      subP.style.cssText = "font-size:12.5px;margin-bottom:8px;";
      box.appendChild(subP);
    }
    const list = el("div","breakdown");
    let html = "";
    if(r.type==="quiz"){
      r.questions.forEach((q,qi)=>{ html += `${qi+1}. ${q.q}<br><em>Risposta corretta: ${q.opts[q.correct]}</em><br>`; });
    } else if(r.type==="multi"){
      r.options.forEach(o=>{ html += `${o.ok?"✓ problema reale":"○ non è un problema"} — ${o.t}<br>`; });
    } else if(r.type==="boss"){
      html += `<em>Brief:</em><br>${r.brief.replace(/\n/g,"<br>")}<br><br>`;
      r.steps.forEach(step=>{
        html += `<strong>${step.label}</strong>:<br>`;
        step.opts.forEach(o=>{ html += `&nbsp;&nbsp;${o.ok?"✓":"○"} ${o.t}<br>`; });
      });
      html += `<br><em>Prompt idea finale:</em> ${prova.ideaPrompt || r.ideaPrompt || ""}`;
    } else if(r.type==="ricerca"){
      r.tasks.forEach((t,ti)=>{ html += `${ti+1}. ${t.prompt}<br>`; });
    } else if(r.type==="aperte"){
      r.questions.forEach((q,qi)=>{ html += `${qi+1}. ${q.q}<br>`; });
    }
    list.innerHTML = html;
    box.appendChild(list);
    wrap.appendChild(box);
  });
  return wrap;
}

async function saveFile(filename, dataStr){
  try{
    if(window.claude && window.claude.use){
      const downloads = await window.claude.use("downloads");
      if(downloads){
        await downloads.save({filename, data: dataStr});
        showToast("File salvato ✓");
        return;
      }
    }
  }catch(err){
    if(err && err.code==="declined") return; // l'utente ha annullato, nessun errore da mostrare
    showToast("Salvataggio non riuscito — riprova");
    return;
  }
  // fallback (fuori da claude.ai, es. dopo il passaggio a un dominio proprio)
  try{
    const blob = new Blob([dataStr], {type:"text/plain;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ showToast("Salvataggio non riuscito su questo dispositivo"); }
}

function exportCSV(students){
  let csv = "Cognome,Nome,Classe,NumeroProve,CreditoResiduo,VotoAttuale\n";
  students.forEach(s=>{
    csv += `${s.cognome},${s.nome},${s.classe},${s.prove.length},${s.credito},${s.voto!=null ? s.voto.toFixed(1) : ""}\n`;
  });
  saveFile("graphic_skills_check.csv", csv);
}

function exportBackup(){
  const backup = {v:1, exportedAt:Date.now(), accounts:getAccounts(), teacherDB:getDB()};
  const dateStr = new Date().toISOString().slice(0,10);
  saveFile(`gsc_backup_${dateStr}.json`, JSON.stringify(backup, null, 2));
}

function mergeBackup(parsed){
  let addedAcc=0, skippedAcc=0, addedStu=0, mergedStu=0;
  if(parsed.accounts){
    const accounts = getAccounts();
    Object.keys(parsed.accounts).forEach(u=>{
      if(!accounts[u]){ accounts[u] = parsed.accounts[u]; addedAcc++; }
      else { skippedAcc++; }
    });
    saveAccounts(accounts);
  }
  if(parsed.teacherDB && parsed.teacherDB.students){
    const db = getDB();
    Object.keys(parsed.teacherDB.students).forEach(k=>{
      const incoming = parsed.teacherDB.students[k];
      if(!db.students[k]){ db.students[k] = incoming; addedStu++; }
      else {
        const existing = db.students[k];
        const existingTs = new Set(existing.prove.map(p=>p.ts));
        let addedHere = 0;
        incoming.prove.forEach(p=>{
          if(!existingTs.has(p.ts)){ existing.prove.push(p); addedHere++; }
        });
        if(addedHere>0){
          existing.prove.sort((a,b)=>a.ts-b.ts);
          const last = existing.prove[existing.prove.length-1];
          existing.credito = last.totale - (last.voto-2)*200;
          existing.voto = computeAvgVoto(existing.prove);
          mergedStu++;
        }
      }
    });
    saveDB(db);
  }
  return {addedAcc, skippedAcc, addedStu, mergedStu};
}

/* Sblocca una prova "abbandonata": lo studente potrà rifarla da capo. */
function teacherUnlockProva(uname, provaId){
  const accounts = getAccounts();
  const acc = accounts[uname];
  if(acc && acc.startedProve){
    const hasProgress = acc.inProgress && acc.inProgress[provaId];
    if(hasProgress){
      // c'è un progresso salvato: lo studente riprende da lì, non da zero
      if(!acc.resumeAllowed) acc.resumeAllowed = {};
      acc.resumeAllowed[provaId] = true;
      saveAccounts(accounts);
      showToast("Prova sbloccata — lo studente riprenderà da dove aveva lasciato");
    } else {
      // nessun progresso salvato (es. prova sbloccata prima di questo aggiornamento): riparte da capo
      delete acc.startedProve[provaId];
      saveAccounts(accounts);
      showToast("Prova sbloccata — nessun progresso salvato, lo studente ripartirà da capo");
    }
    render();
  }
}
/* Conclude una prova abbandonata con 0€ di fatturato, invece di lasciarla sospesa per sempre. */
function teacherZeroProva(uname, provaId){
  const accounts = getAccounts();
  const acc = accounts[uname];
  if(!acc) return;
  if(!confirm("Concludere questa prova con 0€ di fatturato? Lo studente non potrà più rifarla. Operazione non reversibile.")) return;
  const provaDef = PROVE.find(x=>x.id===provaId);
  acc.prove.push({ts:Date.now(), provaId, provaTitle: provaDef?provaDef.title:"Prova", gross:0, rounds:null, idea:""});
  if(acc.startedProve) delete acc.startedProve[provaId];
  if(acc.inProgress) delete acc.inProgress[provaId];
  if(acc.resumeAllowed) delete acc.resumeAllowed[provaId];
  recomputeStudentProve(acc);
  saveAccounts(accounts);
  showToast("Prova conclusa con 0€ di fatturato");
  render();
}
/* Il docente modifica a mano il punteggio di un round già fatto (utile soprattutto
   per i round "ricerca" con le foto, dove serve un giudizio umano) e tutto il resto
   (compenso della prova, credito, voto, media) viene ricalcolato di conseguenza. */
function teacherEditRoundScore(uname, provaTs, roundKey){
  const accounts = getAccounts();
  const acc = accounts[uname];
  if(!acc) return;
  const rec = acc.prove.find(p=>p.ts===provaTs);
  if(!rec || !rec.rounds || !rec.rounds[roundKey]) return;
  const rr = rec.rounds[roundKey];
  const title = (ROUND_REGISTRY[roundKey] && ROUND_REGISTRY[roundKey].title) || roundKey;
  const input = prompt(`Nuovo punteggio per "${title}" (su ${rr.total}):`, rr.correct);
  if(input===null) return;
  let val = parseFloat(String(input).replace(",", "."));
  if(isNaN(val)){ showToast("Valore non valido"); return; }
  val = Math.max(0, Math.min(rr.total, val));
  rr.correct = val;
  // ricalcola il compenso di questa prova sommando i punteggi di tutti i suoi round
  let totalPts=0, maxPts=0;
  Object.values(rec.rounds).forEach(x=>{ if(x){ totalPts += (x.correct||0); maxPts += (x.total||0); } });
  if(maxPts>0) rec.gross = Math.max(10, Math.min(1000, Math.round((totalPts/maxPts)*1000)));
  recomputeStudentProve(acc);
  saveAccounts(accounts);
  showToast("Punteggio aggiornato ✓");
  render();
}

      });

    }

    screen.appendChild(item);
  });

  $app.appendChild(screen);
}
